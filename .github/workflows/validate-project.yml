name: validate-voiceink-overlay

on:
  push:
  pull_request:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_project.py
      - run: python scripts/verify_overlay.py

  apply-overlay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [core, full]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact VoiceInk overlay
        shell: bash
        run: |
          if [[ "${{ matrix.mode }}" == "core" ]]; then
            ./scripts/prepare-app.sh --core-only --reset
          else
            ./scripts/prepare-app.sh --reset
          fi
      - run: git -C app diff --check
