name: validate-voiceink-overlay

on:
  push:
  pull_request:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_project.py
      - run: python scripts/verify_overlay.py

  deterministic-cleanup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic cleanup tests
        run: |
          swiftc \
            overlays/core/VoiceInk/Transcription/Processing/DeterministicDictationCleaner.swift \
            scripts/DeterministicDictationCleanerTests.swift \
            -o /tmp/syll-cleanup-tests
          /tmp/syll-cleanup-tests
      - name: Run recorder HUD presentation policy tests
        run: |
          swiftc \
            overlays/core/VoiceInk/Views/Recorder/SyllRecorderHUDPresentationPolicy.swift \
            scripts/SyllRecorderHUDPresentationPolicyTests.swift \
            -o /tmp/syll-recorder-hud-policy-tests
          /tmp/syll-recorder-hud-policy-tests
      - name: Run command registry tests
        run: |
          swiftc \
            overlays/core/VoiceInk/Commands/SyllCommand.swift \
            overlays/core/VoiceInk/Commands/SyllCommandRegistry.swift \
            scripts/SyllCommandRegistryTests.swift \
            -o /tmp/syll-command-registry-tests
          /tmp/syll-command-registry-tests
      - name: Run bounded command executor tests
        run: |
          swiftc \
            overlays/core/VoiceInk/Commands/SyllCommand.swift \
            overlays/core/VoiceInk/Commands/SyllCommandContext.swift \
            overlays/core/VoiceInk/Commands/SyllCommandExecutor.swift \
            scripts/SyllCommandExecutorTests.swift \
            -o /tmp/syll-command-executor-tests
          /tmp/syll-command-executor-tests
      - name: Run repository context tests
        run: |
          swiftc \
            overlays/core/VoiceInk/Commands/SyllCommandContext.swift \
            scripts/SyllCommandContextTests.swift \
            -o /tmp/syll-command-context-tests
          /tmp/syll-command-context-tests

  apply-overlay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [core, full]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact VoiceInk overlay
        shell: bash
        run: |
          if [[ "${{ matrix.mode }}" == "core" ]]; then
            ./scripts/prepare-app.sh --core-only --reset
          else
            ./scripts/prepare-app.sh --reset
          fi
      - run: git -C app diff --check
